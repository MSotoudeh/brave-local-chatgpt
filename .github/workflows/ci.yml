name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test MCP protocol
        shell: powershell
        run: .\scripts\test-mcp-protocol.ps1
      - name: Build distributable
        shell: powershell
        run: .\scripts\build-distributable.ps1
      - name: Verify distributable
        shell: powershell
        run: .\scripts\test-distributable.ps1
      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: brave-local-windows
          path: dist/brave-local-0.2.1-windows.zip
